name: Deploy Blogger Studio to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'blogger-studio/**'
      - 'scripts/generate-public-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site files
        run: |
          test -f blogger-studio/index.html
          test -f blogger-studio/assets/css/app.css
          test -f blogger-studio/assets/js/app.js
          test -f blogger-studio/view.html
          node --check blogger-studio/assets/js/app.js
          node --check blogger-studio/assets/js/public-view.js
          node --check scripts/generate-public-pages.mjs
      - name: Generate static SEO pages
        env:
          SUPABASE_URL: https://zxlhwrmuebyfiksjrhrb.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_puKPQERSPv3lUowWlDio-Q_JVSZ9540
        run: node scripts/generate-public-pages.mjs
      - name: Publish site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: blogger-studio
          force_orphan: true
