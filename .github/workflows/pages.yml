name: Deploy Blogger Studio to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'blogger-studio/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site files
        run: |
          test -f blogger-studio/index.html
          test -f blogger-studio/assets/css/app.css
          test -f blogger-studio/assets/js/app.js
          node --check blogger-studio/assets/js/app.js
      - name: Publish site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: blogger-studio
          force_orphan: true
